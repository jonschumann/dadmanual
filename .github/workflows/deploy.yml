name: Deploy dadman-docs

on:
  push:
    # hardware-manuals is the sole deploy source. main only receives automated
    # CORRECTIONS.md commits from the corrections-dashboard and is frequently
    # behind hardware-manuals in actual content — deploying from it would
    # silently roll back the live site. Do not add main back here without
    # also fixing that divergence.
    branches: [hardware-manuals]
    paths:
      - "dadman-docs/**"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    name: Build Docker image → GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dadman-docs
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dadman-docs:latest
            ghcr.io/${{ github.repository_owner }}/dadman-docs:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (idempotent — requires PAT with write:packages)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/dadman-docs \
            -f visibility=public \
            2>/dev/null || echo "Package visibility unchanged"
