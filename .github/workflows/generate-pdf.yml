name: Generate PDF

on:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: dadman-docs
        run: npm ci

      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libatspi2.0-0

      - name: Ensure Puppeteer Chromium
        working-directory: dadman-docs
        run: npx puppeteer browsers install chrome

      - name: Build the site
        working-directory: dadman-docs
        run: npm run build

      - name: Serve the build and wait for it
        working-directory: dadman-docs
        run: |
          npx serve build -l 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then echo "site is up"; break; fi
            echo "waiting for site… ($i)"; sleep 2
          done

      - name: Generate the PDF
        working-directory: dadman-docs
        run: node scripts/generate-pdf.js --base-url http://localhost:3000 --locale en

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: dadman-user-manual-pdf
          path: dadman-docs/*.pdf
          if-no-files-found: error
