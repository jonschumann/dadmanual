name: Crowdin — Download translations

# ─────────────────────────────────────────────────────────────────────────────
# Downloads completed translations from Crowdin and commits them directly to
# hardware-manuals, which triggers deploy.yml and rebuilds the live site.
#
# Runs:
#   • Every Monday at 07:00 UTC
#   • Manually via the Actions tab (Run workflow)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  download-translations:
    name: Download translations → push to hardware-manuals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardware-manuals
        uses: actions/checkout@v4
        with:
          ref: hardware-manuals
          token: ${{ secrets.GITHUB_TOKEN }}

      # Let the Crowdin action download files only — no git operations
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          config: dadman-docs/crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # We handle all git operations ourselves
      - name: Commit and push translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dadman-docs/i18n/
          if git diff --cached --quiet; then
            echo "No translation changes to commit — already up to date."
          else
            git commit -m "i18n: update translations from Crowdin"
            git push origin hardware-manuals
          fi
