<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DADman — Corrections Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --text: #e2e6f0;
    --text-dim: #7a82a0;
    --accent: #4f8ef7;
    --green: #2ea84f;
    --green-dim: #1a3d28;
    --red: #e05050;
    --red-dim: #3d1a1a;
    --orange: #e07820;
    --orange-dim: #3a2010;
    --radius: 8px;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge.pending  { background: var(--orange-dim); color: var(--orange); }
  .badge.approved { background: var(--green-dim);  color: var(--green);  }
  .badge.denied   { background: var(--red-dim);    color: var(--red);    }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn.primary  { background: var(--accent);  border-color: var(--accent);  color: #fff; }
  .btn.primary:hover { background: #3a7de8; }
  .btn.approve  { background: var(--green-dim);  border-color: var(--green);  color: var(--green); }
  .btn.approve:hover { background: #1d5030; }
  .btn.deny     { background: var(--red-dim);    border-color: var(--red);    color: var(--red);   }
  .btn.deny:hover { background: #5a2020; }
  .btn.sm { padding: 3px 8px; font-size: 11px; }

  #poll-indicator {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  #poll-indicator.active { background: var(--accent); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .tab {
    padding: 8px 16px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    border: 1px solid transparent;
    border-bottom: none;
    margin-bottom: -1px;
    transition: color 0.15s;
  }

  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    background: var(--bg);
    border-color: var(--border);
  }

  /* ── Main ── */
  main {
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--text-dim);
  }

  .empty svg { opacity: 0.3; margin-bottom: 12px; }

  /* ── Correction Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .card.pending  { border-left: 3px solid var(--orange); }
  .card.approved { border-left: 3px solid var(--green);  opacity: 0.7; }
  .card.denied   { border-left: 3px solid var(--red);    opacity: 0.7; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .card-header .page-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .card-header .date {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .original-comment {
    margin: 12px 16px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 6px;
    border-left: 2px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .fields {
    padding: 4px 16px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }

  .field label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .field input,
  .field textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    padding: 6px 10px;
    resize: vertical;
    transition: border-color 0.15s;
  }

  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea { min-height: 56px; }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }

  .card-footer .spacer { flex: 1; }

  .deny-reason {
    display: none;
    flex: 1;
  }
  .deny-reason.show { display: block; }
  .deny-reason input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--red);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 10px;
  }
  .deny-reason input::placeholder { color: var(--text-dim); }

  .status-note {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }

  /* ── Toast ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
  }

  .toast {
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    animation: slide-in 0.2s ease;
    max-width: 340px;
  }

  .toast.success { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); }
  .toast.error   { background: var(--red-dim);   border: 1px solid var(--red);   color: var(--red);   }

  @keyframes slide-in {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
</style>
</head>
<body>

<header>
  <h1>DADman <span>/</span> Corrections</h1>
  <div class="status-bar">
    <span id="badge-pending" class="badge pending">0 pending</span>
    <span id="badge-approved" class="badge approved">0 approved</span>
    <span id="badge-denied" class="badge denied">0 denied</span>
    <span id="last-polled">—</span>
    <div id="poll-indicator"></div>
    <button class="btn" id="btn-poll">Poll now</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="pending">Pending</div>
  <div class="tab" data-tab="approved">Approved</div>
  <div class="tab" data-tab="denied">Denied</div>
  <div class="tab" data-tab="all">All</div>
</div>

<main id="main">
  <div class="empty">
    <div class="spinner"></div>
    <p style="margin-top:12px">Loading corrections…</p>
  </div>
</main>

<div id="toast-container"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let corrections = [];
let currentTab  = 'pending';
let denyPending = {}; // id → true when deny input is showing

// ── API helpers ────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function relDate(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)  return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(c) {
  const isEditable = c.status === 'pending';
  const ro = isEditable ? '' : ' readonly';
  const p = c.parsed;

  const statusNote = c.status === 'approved'
    ? `<span class="status-note">✓ Approved ${relDate(c.approvedAt)} — written to CORRECTIONS.md</span>`
    : c.status === 'denied'
    ? `<span class="status-note">✗ Denied${c.deniedReason ? ': ' + escHtml(c.deniedReason) : ''}</span>`
    : '';

  const footer = isEditable ? `
    <button class="btn sm" onclick="reparse('${c.id}')">↺ Re-parse</button>
    <div class="spacer"></div>
    <div class="deny-reason ${denyPending[c.id] ? 'show' : ''}" id="deny-reason-${c.id}">
      <input type="text" placeholder="Reason for denying (optional)" id="deny-text-${c.id}">
    </div>
    <button class="btn deny sm" onclick="denyClick('${c.id}')">Deny</button>
    <button class="btn approve sm" onclick="approve('${c.id}')">Approve →</button>
  ` : statusNote;

  return `
  <div class="card ${c.status}" id="card-${c.id}">
    <div class="card-header">
      <span class="page-tag">/${escHtml(c.discussionTitle)}</span>
      ${c.isReply ? '<span class="badge" style="background:var(--surface);color:var(--text-dim)">reply</span>' : ''}
      <span class="date">${relDate(c.commentCreatedAt)}</span>
    </div>
    <div class="original-comment">${escHtml(c.commentBody)}</div>
    <div class="fields">
      <div class="field">
        <label>Section</label>
        <input type="text" value="${escHtml(p.section)}" ${ro}
          onchange="updateField('${c.id}','section',this.value)" placeholder="e.g. §7.6.2">
      </div>
      <div class="field">
        <label>File</label>
        <input type="text" value="${escHtml(p.file)}" ${ro}
          onchange="updateField('${c.id}','file',this.value)" placeholder="docs/ch07-operation.md">
      </div>
      <div class="field full">
        <label>Summary</label>
        <input type="text" value="${escHtml(p.summary)}" ${ro}
          onchange="updateField('${c.id}','summary',this.value)" placeholder="One-line description">
      </div>
      <div class="field full">
        <label>Current text (what's wrong)</label>
        <textarea ${ro}
          onchange="updateField('${c.id}','current_text',this.value)"
          placeholder="What the manual currently says…">${escHtml(p.current_text)}</textarea>
      </div>
      <div class="field full">
        <label>Proposed fix</label>
        <textarea ${ro}
          onchange="updateField('${c.id}','proposed_fix',this.value)"
          placeholder="What it should say instead…">${escHtml(p.proposed_fix)}</textarea>
      </div>
    </div>
    <div class="card-footer">${footer}</div>
  </div>`;
}

function renderList() {
  const filtered = currentTab === 'all'
    ? corrections
    : corrections.filter(c => c.status === currentTab);

  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = `<div class="empty">
      <p>No ${currentTab === 'all' ? '' : currentTab + ' '}corrections.</p>
    </div>`;
    return;
  }
  main.innerHTML = filtered.map(renderCard).join('');
}

function updateBadges() {
  const pending  = corrections.filter(c => c.status === 'pending').length;
  const approved = corrections.filter(c => c.status === 'approved').length;
  const denied   = corrections.filter(c => c.status === 'denied').length;
  document.getElementById('badge-pending').textContent  = `${pending} pending`;
  document.getElementById('badge-approved').textContent = `${approved} approved`;
  document.getElementById('badge-denied').textContent   = `${denied} denied`;
}

// ── Actions ────────────────────────────────────────────────────────────────────
async function updateField(id, field, value) {
  await api('PUT', `/api/corrections/${id}`, { parsed: { [field]: value } });
  const c = corrections.find(x => x.id === id);
  if (c) c.parsed[field] = value;
}

async function approve(id) {
  const btn = document.querySelector(`#card-${id} .btn.approve`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Approving…'; }
  try {
    const updated = await api('POST', `/api/corrections/${id}/approve`);
    const idx = corrections.findIndex(x => x.id === id);
    if (idx !== -1) corrections[idx] = updated;
    toast('Correction approved and written to CORRECTIONS.md');
    renderList();
    updateBadges();
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Approve →'; }
  }
}

function denyClick(id) {
  if (denyPending[id]) {
    // Second click — confirm deny
    const reason = document.getElementById(`deny-text-${id}`)?.value || '';
    confirmDeny(id, reason);
  } else {
    // First click — show reason input
    denyPending[id] = true;
    const row = document.getElementById(`deny-reason-${id}`);
    if (row) row.classList.add('show');
    const btn = document.querySelector(`#card-${id} .btn.deny`);
    if (btn) btn.textContent = 'Confirm deny';
  }
}

async function confirmDeny(id, reason) {
  try {
    const updated = await api('POST', `/api/corrections/${id}/deny`, { reason });
    const idx = corrections.findIndex(x => x.id === id);
    if (idx !== -1) corrections[idx] = updated;
    delete denyPending[id];
    toast('Correction denied');
    renderList();
    updateBadges();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function reparse(id) {
  const btn = document.querySelector(`#card-${id} .btn[onclick*="reparse"]`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try {
    const updated = await api('POST', `/api/corrections/${id}/reparse`);
    const idx = corrections.findIndex(x => x.id === id);
    if (idx !== -1) corrections[idx] = updated;
    toast('Re-parsed successfully');
    renderList();
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '↺ Re-parse'; }
  }
}

// ── Refresh loop ───────────────────────────────────────────────────────────────
async function refresh() {
  try {
    corrections = await api('GET', '/api/corrections');
    const status = await api('GET', '/api/status');
    document.getElementById('last-polled').textContent =
      status.lastPolled ? `polled ${relDate(status.lastPolled)}` : 'not yet polled';
    document.getElementById('poll-indicator').className =
      'active' ? (status.isPolling ? 'active' : '') : '';
    updateBadges();
    renderList();
  } catch (e) {
    console.error('Refresh failed:', e);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderList();
  });
});

document.getElementById('btn-poll').addEventListener('click', async () => {
  const btn = document.getElementById('btn-poll');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Polling…';
  await api('POST', '/api/poll');
  // Wait a moment then refresh (poll is async server-side)
  setTimeout(async () => {
    await refresh();
    btn.disabled = false;
    btn.textContent = 'Poll now';
  }, 3000);
});

refresh();
setInterval(refresh, 30_000); // auto-refresh display every 30s
</script>
</body>
</html>
