# ─────────────────────────────────────────────────────────────────────────────
# DADman User Manual — Crowdin Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# How it works:
#   • Source (English) Markdown files are uploaded automatically on push
#   • Translators work in Crowdin's editor with MT-assisted suggestions
#   • Download workflow pulls translations and opens a PR against hardware-manuals
#   • Merging the PR triggers deploy.yml → site rebuilds with translations
# ─────────────────────────────────────────────────────────────────────────────

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

# language_mapping overrides what %locale% outputs for each Crowdin language code.
# This ensures the downloaded translation paths use our exact Docusaurus locale
# directory names (de, fr, ja, es, ko, da) regardless of how Crowdin stores them
# internally (e.g. es-ES, es-MX → both written as "es").
language_mapping:
  de:
    locale: de
  de-AT:
    locale: de
  de-CH:
    locale: de
  fr:
    locale: fr
  fr-CA:
    locale: fr
  fr-CH:
    locale: fr
  ja:
    locale: ja
  es-ES:
    locale: es
  es-MX:
    locale: es
  ko:
    locale: ko
  da:
    locale: da

files:
  # ── Documentation content ────────────────────────────────────────────────
  # Source Markdown in docs/ maps to i18n/<locale>/docusaurus-plugin-content-docs/
  # %locale% resolves using the language_mapping overrides above.
  - source: /docs/**/*.md
    translation: /i18n/%locale%/docusaurus-plugin-content-docs/current/**/%original_file_name%
    excluded_target_languages:
      - en  # English is the source; do not write back to docs/

  # ── Docusaurus UI strings ────────────────────────────────────────────────
  - source: /i18n/en/docusaurus-theme-classic/navbar.json
    translation: /i18n/%locale%/docusaurus-theme-classic/navbar.json

  - source: /i18n/en/docusaurus-theme-classic/footer.json
    translation: /i18n/%locale%/docusaurus-theme-classic/footer.json

  - source: /i18n/en/docusaurus-plugin-content-docs/current.json
    translation: /i18n/%locale%/docusaurus-plugin-content-docs/current.json
