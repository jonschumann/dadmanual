# DADman — Docker Compose for Dockge on TrueNAS
#
# Deploy instructions:
#   1. Open Dockge → http://10.10.1.24:5001
#   2. Click the dadman-docs stack → Edit → paste this file → Deploy
#
#   Source configs live at: /mnt/flash/configs/dadman-docs/
#   Dockge runs the stack from: /mnt/.ix-apps/app_mounts/dockge/stacks/dadman-docs/
#
#   Before deploying, create the env file in the Dockge working directory:
#     ssh root@10.10.1.24
#     nano /mnt/.ix-apps/app_mounts/dockge/stacks/dadman-docs/corrections-dashboard.env
#     (fill in GITHUB_TOKEN and ANTHROPIC_API_KEY, then save)
#
# Cloudflare Tunnel routing:
#   In Zero Trust → Networks → Tunnels → your tunnel → Public Hostnames:
#     docs        → HTTP  10.10.1.24:8095   (docs site)
#     corrections → HTTP  10.10.1.24:3002   (corrections dashboard)
#
# Before first deploy:
#   Create corrections-dashboard.env from .env.example and fill in:
#     GITHUB_TOKEN, ANTHROPIC_API_KEY

services:
  dadman-docs:
    image: ghcr.io/jonschumann/dadman-docs:latest
    container_name: dadman-docs
    restart: unless-stopped
    ports:
      - "8095:80"
    # Watchtower label — auto-pulls new image when GitHub Actions pushes :latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No volumes required — static site is baked into the image
    # Re-deploy happens automatically via Watchtower when CI pushes a new image

  corrections-dashboard:
    image: ghcr.io/jonschumann/corrections-dashboard:latest
    container_name: corrections-dashboard
    restart: unless-stopped
    ports:
      - "3002:3001"
    env_file:
      - corrections-dashboard.env
    volumes:
      - corrections-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  corrections-data:
